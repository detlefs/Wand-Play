name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check tag matches __version__
        run: |
          $v = python -c "from wandplay import __version__; print(__version__)"
          if ("v$v" -ne "${{ github.event.release.tag_name }}") {
            throw "tag ${{ github.event.release.tag_name }} does not match __version__ $v"
          }

      - name: Build
        run: python build.py

      - name: Attach zipped exe to release
        run: |
          $zip = "wandplay-${{ github.event.release.tag_name }}.zip"
          Compress-Archive -Path dist/wandplay.exe -DestinationPath $zip
          gh release upload "${{ github.event.release.tag_name }}" $zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
